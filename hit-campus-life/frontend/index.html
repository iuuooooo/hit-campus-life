<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIT校园生活圈</title>
  <style>
    :root {
      --hit-blue: #24508f;
      --hit-blue-2: #153662;
      --cyan: #1f9bb4;
      --green: #27805d;
      --orange: #d97726;
      --red: #c24145;
      --ink: #1d2939;
      --muted: #667085;
      --line: #dbe4ef;
      --soft: #f4f7fb;
      --soft-2: #eef4fb;
      --paper: #fff;
      --shadow: 0 14px 36px rgba(31, 65, 112, .10);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
      background: #f6f9fd;
      overflow: hidden;
    }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .58; }
    .hidden { display: none !important; }
    .small { color: var(--muted); font-size: 12px; line-height: 1.6; }
    .muted { color: var(--muted); }
    .topbar {
      height: 74px;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 30px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(37,80,143,.045);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 210px; color: var(--hit-blue); font-size: 20px; font-weight: 900; }
    .brand-mark, .avatar { display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--hit-blue), var(--hit-blue-2)); font-weight: 900; flex: none; }
    .brand-mark { width: 44px; height: 44px; border-radius: 50%; font-size: 13px; }
    .avatar { width: 44px; height: 44px; border-radius: 50%; }
    .nav { display: flex; align-items: center; gap: 4px; height: 100%; flex: 1; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav button { height: 100%; padding: 0 14px; color: #344054; background: transparent; font-weight: 850; white-space: nowrap; position: relative; }
    .nav button.active { color: var(--hit-blue); }
    .nav button.active::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 4px; background: var(--hit-blue); border-radius: 999px 999px 0 0; }
    .who { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
    .app-shell {
      height: calc(100vh - 74px);
      display: grid;
      grid-template-columns: 300px minmax(520px, 760px) minmax(320px, 410px) minmax(250px, 300px);
      gap: 22px;
      padding: 24px 28px 22px;
      max-width: 1880px;
      margin: 0 auto;
      overflow: hidden;
    }
    .rail, .feed, .widgets, .aside {
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-right: 4px;
      scrollbar-width: thin;
      scrollbar-color: #b9c8dc transparent;
    }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(37,80,143,.035); overflow: hidden; flex: none; }
    .pad { padding: 16px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .section-title { color: #233853; font-size: 16px; font-weight: 900; }
    .btn { min-height: 38px; padding: 0 14px; border-radius: 8px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .primary { background: var(--hit-blue); color: #fff; }
    .primary:hover { background: var(--hit-blue-2); }
    .secondary { background: #fff; color: var(--hit-blue); border: 1px solid var(--line); }
    .danger { background: #fff1f1; color: var(--red); }
    .text-btn { background: transparent; color: var(--hit-blue); font-weight: 900; padding: 4px 6px; }
    .field, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
      outline: 0;
    }
    .field, select { height: 42px; padding: 0 12px; }
    textarea { min-height: 92px; resize: vertical; padding: 12px; line-height: 1.7; }
    .row2 { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .composer { display: grid; gap: 12px; }
    .composer-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-tabs button { height: 34px; padding: 0 12px; border-radius: 8px; background: #fff; border: 1px solid var(--line); color: #415066; font-weight: 850; }
    .filter-tabs button.active { background: var(--hit-blue); color: #fff; border-color: var(--hit-blue); }
    .profile-row { display: flex; align-items: center; gap: 12px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .stat { background: var(--soft); border-radius: 8px; padding: 9px 6px; text-align: center; }
    .stat b { display: block; color: var(--hit-blue); font-size: 20px; }
    .side-menu { display: flex; flex-direction: column; gap: 4px; }
    .side-menu button { min-height: 42px; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: transparent; border-radius: 8px; color: #405168; font-weight: 850; text-align: left; }
    .side-menu button:hover, .side-menu button.active { background: var(--soft-2); color: var(--hit-blue); }
    .hero { padding: 26px 30px; background: linear-gradient(90deg, rgba(236,243,255,.96), rgba(240,246,255,.86)); border-bottom: 1px solid var(--line); }
    .hero h1 { margin: 0 0 8px; color: var(--hit-blue); font-size: 26px; line-height: 1.25; }
    .hero p { margin: 0; color: #48627f; line-height: 1.8; }
    .post, .card, .notice, .person { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 14px; }
    .post { border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; }
    .post:first-child { border-top: 0; }
    .post-head, .person { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; }
    .badge, .tag { display: inline-flex; align-items: center; font-size: 12px; font-weight: 850; }
    .badge { height: 22px; padding: 0 8px; border-radius: 999px; background: var(--soft-2); color: var(--hit-blue); }
    .tag { padding: 5px 8px; border-radius: 8px; background: var(--soft); color: var(--hit-blue); margin: 3px; }
    .post h3 { margin: 10px 0 6px; color: #203650; font-size: 17px; }
    .post p, .card p { line-height: 1.75; color: #44556b; white-space: pre-wrap; }
    .actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-top: 1px solid #edf1f6; padding-top: 9px; margin-top: 10px; }
    .actions button { min-height: 32px; background: transparent; color: var(--muted); border-radius: 8px; padding: 0 10px; font-weight: 800; }
    .actions button:hover { background: var(--soft-2); color: var(--hit-blue); }
    .comment-box { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 10px; }
    .comment { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 13px; line-height: 1.55; }
    .rec-list { display: grid; gap: 10px; }
    .score { color: var(--hit-blue); font-size: 24px; font-weight: 900; }
    .price { color: var(--orange); font-weight: 900; }
    .market-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .schedule-grid { display: grid; grid-template-columns: repeat(7, minmax(120px, 1fr)); gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .schedule-day { min-height: 150px; background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
    .schedule-day b { color: var(--hit-blue); }
    .score-detail { display: grid; gap: 6px; margin-top: 10px; }
    .score-line { display: grid; grid-template-columns: 72px 46px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 12px; color: #536579; }
    .score-line strong { color: var(--hit-blue); }
    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 26px;
      background: radial-gradient(circle at 16% 18%, rgba(36,80,143,.10), transparent 28%), radial-gradient(circle at 84% 86%, rgba(31,155,180,.08), transparent 30%), #fbfdff;
    }
    .login-shell { width: min(1320px, 100%); min-height: 720px; display: grid; grid-template-columns: 1.05fr .95fr; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 20px 54px rgba(37,80,143,.14); overflow: hidden; }
    .login-left { padding: 58px 64px; border-right: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(246,249,253,.82)); }
    .login-brand { display: flex; align-items: center; gap: 18px; color: var(--hit-blue); font-size: 30px; font-weight: 900; }
    .login-slogan { margin-top: 170px; color: var(--hit-blue); font-size: 40px; line-height: 1.22; font-weight: 900; }
    .login-copy { margin-top: 18px; color: #355983; font-size: 17px; line-height: 1.8; }
    .login-card { display: grid; place-items: center; padding: 62px; }
    .login-inner { width: min(460px, 100%); }
    .login-inner h1 { margin: 0 0 10px; color: var(--hit-blue); font-size: 32px; }
    .quick-logins { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 80; background: #17233a; color: #fff; padding: 12px 16px; border-radius: 8px; box-shadow: 0 16px 38px rgba(0,0,0,.24); opacity: 0; transform: translateY(10px); transition: .22s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 1280px) { .app-shell { grid-template-columns: 280px minmax(500px, 1fr) 320px; } .aside { display: none; } }
    @media (max-width: 980px) { body { overflow: auto; } .topbar { position: static; } .app-shell { height: auto; grid-template-columns: 1fr; overflow: visible; } .rail, .feed, .widgets, .aside { overflow: visible; display: flex; } .aside { display: flex; } .login-shell { grid-template-columns: 1fr; } .login-left { display: none; } .row2, .grid2, .market-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <section class="login-page" id="loginPage">
    <div class="login-shell">
      <div class="login-left">
        <div class="login-brand"><div class="brand-mark">HIT</div><div>HIT校园生活圈</div></div>
        <div class="login-slogan">让搭子、活动、求助和记录真正流转起来</div>
        <div class="login-copy">面向校园日常协作的综合平台，支持学生账号与社团账号共同发布内容、参与活动、处理申请、接收通知和寻找搭子。</div>
      </div>
      <div class="login-card">
        <div class="login-inner">
          <h1>登录校园账号</h1>
          <div class="small">可用账号：student_yu / fish / basket / alice / photo_club / badminton_club / volunteer_union，密码均为 123456。</div>
          <input class="field" id="loginUser" value="student_yu" placeholder="用户名" />
          <input class="field" id="loginPass" type="password" value="123456" placeholder="密码" />
          <div class="quick-logins" id="quickLogins"></div>
          <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
            <button class="btn primary" data-action="login">登录</button>
            <button class="btn secondary" data-fill-login="photo_club">摄影社账号</button>
            <button class="btn secondary" data-fill-login="badminton_club">羽毛球社账号</button>
          </div>
          <hr style="border:0;border-top:1px solid var(--line);margin:24px 0">
          <div class="section-title">注册学生账号</div>
          <input class="field" id="regName" placeholder="姓名，例如：小陈同学" />
          <input class="field" id="regUser" placeholder="用户名，例如：chen" />
          <input class="field" id="regInterests" placeholder="兴趣标签：自习,羽毛球,摄影" />
          <button class="btn secondary" data-action="register">注册并进入</button>
        </div>
      </div>
    </div>
  </section>

  <header class="topbar app-ui hidden">
    <div class="brand"><div class="brand-mark">HIT</div><span>校园生活圈</span></div>
    <nav class="nav" id="nav"></nav>
    <div class="who"><span class="small" id="who"></span><button class="btn secondary" data-action="logout">退出</button></div>
  </header>
  <main class="app-shell app-ui hidden">
    <aside class="rail" id="rail"></aside>
    <section class="feed" id="feed"></section>
    <section class="widgets" id="widgets"></section>
    <aside class="aside" id="aside"></aside>
  </main>
  <div class="toast" id="toast"></div>

<script>
const API = location.origin;
const loginAccounts = [
  ['student_yu', '小宇学长'],
  ['fish', '一只鱼鱼'],
  ['basket', '篮球少年'],
  ['alice', '阿澄同学'],
  ['photo_club', 'HIT摄影社'],
  ['badminton_club', '羽毛球社'],
  ['volunteer_union', '志愿服务队']
];
const state = {
  user: JSON.parse(localStorage.getItem('hit_user') || 'null'),
  page: 'home',
  channel: 'all',
  posts: [],
  activities: [],
  clubs: [],
  buddyTasks: [],
  marketItems: [],
  notes: [],
  dashboard: null,
  applications: [],
  matchResults: []
};
const studentNav = [
  {id: 'home', label: '首页动态'},
  {id: 'match', label: '智能搭子匹配'},
  {id: 'activities', label: '校园活动'},
  {id: 'market', label: '二手市场'},
  {id: 'clubs', label: '社团申请'},
  {id: 'profile', label: '个人中心'},
  {id: 'notifications', label: '通知'}
];
const orgNav = [
  {id: 'home', label: '内容发布'},
  {id: 'activities', label: '活动管理'},
  {id: 'market', label: '二手市场'},
  {id: 'applications', label: '成员申请'},
  {id: 'profile', label: '组织中心'},
  {id: 'notifications', label: '通知'}
];
const channelLabels = { all: '全部', life: '生活记录', study: '学习交流', help: '求助/搭子', club: '社团活动', market: '二手/跑腿' };

function $(id) { return document.getElementById(id); }
function esc(value) { return String(value ?? '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s])); }
async function api(path, opts = {}) {
  const res = await fetch(API + path, { headers: {'Content-Type': 'application/json'}, ...opts });
  let data = null;
  try { data = await res.json(); } catch (err) {}
  if (!res.ok) throw new Error(data?.detail || '请求失败');
  return data;
}
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function saveUser(user) {
  state.user = user;
  localStorage.setItem('hit_user', JSON.stringify(user));
}
function navItems() { return state.user?.role === 'org' ? orgNav : studentNav; }

async function loadAppData() {
  if (!state.user) return;
  const base = [
    api('/api/clubs'),
    api(`/api/notifications?user_id=${state.user.id}`),
    api(`/api/posts?current_user_id=${state.user.id}&channel=${state.channel}`),
    api(`/api/activities?current_user_id=${state.user.id}`),
    api(`/api/buddy-tasks?current_user_id=${state.user.id}`),
    api(`/api/market-items?current_user_id=${state.user.id}`),
    api(`/api/dashboard/${state.user.id}`)
  ];
  const [clubs, notes, posts, activities, buddyTasks, marketItems, dashboard] = await Promise.all(base);
  state.clubs = clubs;
  state.notes = notes;
  state.posts = posts;
  state.activities = activities;
  state.buddyTasks = buddyTasks;
  state.marketItems = marketItems;
  state.dashboard = dashboard;
  if (state.user.role === 'org') {
    state.applications = await api(`/api/applications?owner_id=${state.user.id}`);
  }
}
async function setPage(page) {
  state.page = page;
  await loadAppData();
  render();
}
async function login() {
  const data = await api('/api/auth/login', {
    method: 'POST',
    body: JSON.stringify({ username: $('loginUser').value.trim(), password: $('loginPass').value })
  });
  saveUser(data.user);
  state.page = 'home';
  await loadAppData();
  renderShell();
  toast('登录成功');
}
async function register() {
  const name = $('regName').value.trim();
  const username = $('regUser').value.trim();
  if (!name || !username) return toast('请填写姓名和用户名');
  const data = await api('/api/auth/register', {
    method: 'POST',
    body: JSON.stringify({ username, password: '123456', name, role: 'student', interests: $('regInterests').value })
  });
  saveUser(data.user);
  state.page = 'profile';
  await loadAppData();
  renderShell();
  toast('注册成功，默认密码 123456');
}
function logout() {
  localStorage.removeItem('hit_user');
  location.reload();
}

function renderShell() {
  renderQuickLogins();
  if (!state.user) {
    $('loginPage').classList.remove('hidden');
    document.querySelectorAll('.app-ui').forEach(el => el.classList.add('hidden'));
    return;
  }
  $('loginPage').classList.add('hidden');
  document.querySelectorAll('.app-ui').forEach(el => el.classList.remove('hidden'));
  $('who').textContent = `${state.user.name} · ${state.user.role === 'org' ? '社团账号' : '学生账号'}`;
  render();
}
function renderQuickLogins() {
  const el = $('quickLogins');
  if (!el) return;
  el.innerHTML = loginAccounts.map(([username, name]) => `<button class="btn secondary" data-fill-login="${username}">${esc(name)}</button>`).join('');
}
function render() {
  if (!state.user) return;
  renderNav();
  renderRail();
  renderFeed();
  renderWidgets();
  renderAside();
}
function renderNav() {
  $('nav').innerHTML = navItems().map(item => `<button data-page="${item.id}" class="${state.page === item.id ? 'active' : ''}">${item.label}</button>`).join('');
}
function renderRail() {
  const user = state.user;
  $('rail').innerHTML = `
    <section class="panel pad">
      <div class="profile-row">
        <div class="avatar">${esc(user.avatar || user.name.slice(0,1))}</div>
        <div><b>${esc(user.name)}</b><div class="small">${esc(user.college || '学院未填写')} ${esc(user.grade || '')}</div></div>
      </div>
      <div class="stats">
        <div class="stat"><b>${user.credit_score}</b><span class="small">信用分</span></div>
        <div class="stat"><b>${(user.interest_list || []).length}</b><span class="small">标签</span></div>
        <div class="stat"><b>${state.notes.filter(n => !n.is_read).length}</b><span class="small">未读</span></div>
      </div>
    </section>
    <section class="panel pad">
      <div class="section-title" style="margin-bottom:10px">功能入口</div>
      <div class="side-menu">${navItems().map(item => `<button class="${state.page === item.id ? 'active' : ''}" data-page="${item.id}">${item.label}</button>`).join('')}</div>
    </section>
    <section class="panel pad">
      <div class="section-title">个人偏好</div>
      <div style="margin-top:8px">${(user.interest_list || []).map(tag => `<span class="tag">${esc(tag)}</span>`).join('') || '<span class="small">还没有填写兴趣标签</span>'}</div>
      <div class="small" style="margin-top:8px">地点：${esc(user.location_preference || '未填写')}<br>时间：${esc(user.schedule_preference || '未填写')}</div>
    </section>
  `;
}
function renderFeed() {
  $('feed').innerHTML = renderComposer() + renderPageContent();
}
function renderComposer() {
  return `
    <section class="panel">
      <div class="hero">
        <h1>${state.user.role === 'org' ? '发布社团动态与活动信息' : '发布校园动态、求助和搭子需求'}</h1>
        <p>这个输入区会常驻在主内容区，切换到匹配、活动、社团或通知板块时也可以继续发帖。</p>
      </div>
      <div class="pad composer">
        <div class="row2">
          <input class="field" id="postTitle" placeholder="标题" />
          <select id="postChannel">
            <option value="life">生活记录</option>
            <option value="study">学习交流</option>
            <option value="help">求助/搭子</option>
            <option value="club">社团活动</option>
            <option value="market">二手/跑腿</option>
          </select>
        </div>
        <textarea id="postContent" placeholder="写下内容"></textarea>
        <input class="field" id="postTags" placeholder="标签，用逗号分隔：自习,摄影,羽毛球" />
        <div class="composer-actions">
          <div class="filter-tabs">${Object.entries(channelLabels).map(([key, label]) => `<button data-channel="${key}" class="${state.channel === key ? 'active' : ''}">${label}</button>`).join('')}</div>
          <button class="btn primary" data-action="createPost">发布帖子</button>
        </div>
      </div>
    </section>
  `;
}
function renderPageContent() {
  if (state.page === 'match') return renderMatch();
  if (state.page === 'activities') return renderActivities();
  if (state.page === 'market') return renderMarket();
  if (state.page === 'clubs') return renderClubs();
  if (state.page === 'applications') return renderApplications();
  if (state.page === 'profile') return renderProfile();
  if (state.page === 'notifications') return renderNotifications();
  return renderPosts();
}
function renderPosts() {
  return `<section class="panel"><div class="pad section-head"><div class="section-title">信息流</div><span class="small">${channelLabels[state.channel]}</span></div>${state.posts.map(postCard).join('') || '<div class="pad muted">暂无内容</div>'}</section>`;
}

async function createPost() {
  const title = $('postTitle').value.trim();
  const content = $('postContent').value.trim();
  if (!title || !content) return toast('标题和内容不能为空');
  await api('/api/posts', {
    method: 'POST',
    body: JSON.stringify({ user_id: state.user.id, title, content, channel: $('postChannel').value, tags: $('postTags').value })
  });
  $('postTitle').value = '';
  $('postContent').value = '';
  $('postTags').value = '';
  state.page = 'home';
  await loadAppData();
  render();
  toast('发布成功');
}

  await api(`/api/market-items/${id}/reserve`, { method: 'POST', body: JSON.stringify({ user_id: state.user.id }) });
  await loadAppData();
  render();
  toast('预约成功');
}
async function cancelMarket(id) {
  await api(`/api/market-items/${id}/cancel-reservation`, { method: 'POST', body: JSON.stringify({ user_id: state.user.id }) });
  await loadAppData();
  render();
  toast('预约已取消');
}
async function applyClub(id) {
  const input = $('clubMsg' + id);
  await api(`/api/clubs/${id}/apply`, { method: 'POST', body: JSON.stringify({ user_id: state.user.id, message: input.value }) });
  await loadAppData();
  render();
  toast('申请已提交');
}
async function reviewApp(id, status) {
  await api(`/api/applications/${id}/review`, { method: 'POST', body: JSON.stringify({ reviewer_id: state.user.id, status }) });
  await loadAppData();
  render();
  toast('审核完成');
}
async function saveProfile() {
  const data = await api(`/api/users/${state.user.id}`, {
    method: 'PUT',
    body: JSON.stringify({ name: $('pfName').value, college: $('pfCollege').value, grade: $('pfGrade').value, bio: $('pfBio').value, interests: $('pfInterests').value, location_preference: $('pfPlace').value, schedule_preference: $('pfTime').value })
  });
  saveUser(data.user);
  await loadAppData();
  renderShell();
  toast('资料已保存');
}
async function readAll() {
  await api('/api/notifications/read-all', { method: 'POST', body: JSON.stringify({ user_id: state.user.id }) });
  await loadAppData();
  render();
}
async function createSchedule() {
  const title = $('scTitle').value.trim();
  if (!title) return toast('请填写课表名称');
  await api('/api/schedule', {
    method: 'POST',
    body: JSON.stringify({ user_id: state.user.id, weekday: $('scWeekday').value, start_time: $('scStart').value, end_time: $('scEnd').value, title, place: $('scPlace').value, note: $('scNote').value })
  });
  await loadAppData();
  render();
  toast('课表已更新');
}
async function deleteSchedule(id) {
  await api(`/api/schedule/${id}?user_id=${state.user.id}`, { method: 'DELETE' });
  await loadAppData();
  render();
  toast('课表项已删除');
}
async function createDaily() {
  const title = $('drTitle').value.trim();
  if (!title) return toast('请填写记录标题');
  await api('/api/daily-records', {
    method: 'POST',
    body: JSON.stringify({ user_id: state.user.id, title, content: $('drContent').value, mood: $('drMood').value, tags: $('drTags').value })
  });
  await loadAppData();
  render();
  toast('日常已保存');
}
async function deleteDaily(id) {
  await api(`/api/daily-records/${id}?user_id=${state.user.id}`, { method: 'DELETE' });
  await loadAppData();
  render();
  toast('日常记录已删除');
}

document.addEventListener('click', async event => {
  try {
    const page = event.target.closest('[data-page]');
    if (page) return setPage(page.dataset.page);
    const fill = event.target.closest('[data-fill-login]');
    if (fill) {
      $('loginUser').value = fill.dataset.fillLogin;
      $('loginPass').value = '123456';
      return;
    }
    const channel = event.target.closest('[data-channel]');
    if (channel) {
      state.channel = channel.dataset.channel;
      state.page = 'home';
      await loadAppData();
      return render();
    }
    const focus = event.target.closest('[data-focus-comment]');
    if (focus) {
      document.querySelector(`[data-comment-input="${focus.dataset.focusComment}"]`)?.focus();
      return;
    }
    const el = event.target.closest('[data-action]');
    if (!el) return;
    const id = el.dataset.id;
    const actions = {
      login,
      register,
      logout,
      createPost,
      runMatch,
      createBuddy,
      refreshAll: async () => { await loadAppData(); render(); },
      createActivity,
      createMarketItem,
      saveProfile,
      readAll,
      createSchedule,
      createDaily,
      comment: () => comment(id),
      like: () => like(id),
      joinBuddy: () => joinBuddy(id),
      leaveBuddy: () => leaveBuddy(id),
      joinActivity: () => joinActivity(id),
      cancelActivity: () => cancelActivity(id),
      reserveMarket: () => reserveMarket(id),
      cancelMarket: () => cancelMarket(id),
      applyClub: () => applyClub(id),
      reviewApp: () => reviewApp(id, el.dataset.status),
      deleteSchedule: () => deleteSchedule(id),
      deleteDaily: () => deleteDaily(id)
    };
    await actions[el.dataset.action]?.();
  } catch (err) {
    toast(err.message);
  }
});
document.addEventListener('keydown', async event => {
  const input = event.target.closest('[data-comment-input]');
  if (input && event.key === 'Enter') {
    event.preventDefault();
    try { await comment(input.dataset.commentInput); } catch (err) { toast(err.message); }
  }
});

renderQuickLogins();
if (state.user) {
  loadAppData().then(renderShell).catch(err => {
    localStorage.removeItem('hit_user');
    toast(err.message);
    renderShell();
  });
} else {
  renderShell();
}
</script>
</body>
</html>
